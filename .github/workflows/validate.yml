name: Validate Nightwatch
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          node --check dist/app.js
          node --check dist/cmc.js
          node --check dist/cloud-map.js
          node --check dist/aurora-map.js
          node --check dist/viewing-score.js
          node --check dist/light-pollution.js
          node --check backend/worker.mjs
          node --test tests/*.test.cjs
      - name: Check static entrypoint and assets
        run: |
          python3 - <<'PYTHON'
          from html.parser import HTMLParser
          from pathlib import Path
          class Assets(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  ref = attrs.get('src') if tag == 'script' else attrs.get('href') if tag == 'link' and attrs.get('rel') == 'stylesheet' else None
                  if ref and not ref.startswith(('https://', 'http://', '//')):
                      assert (Path('dist') / ref).is_file(), f'Missing asset: {ref}'
          Assets().feed(Path('dist/index.html').read_text())
          PYTHON
