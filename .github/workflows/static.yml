# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          node --check dist/imaging-advisor.js
          node --check dist/imaging-ui.js
          node --check dist/forecast-time.js
          node --check dist/app.js
          node --check dist/cmc.js
          node --check dist/cloud-map.js
          node --check dist/aurora-map.js
          node --check dist/viewing-score.js
          node --check dist/weather-utils.js
          node --check dist/light-pollution.js
          node --check backend/worker.mjs
          node --test tests/*.test.cjs
      - name: Prepare versioned static assets
        run: node scripts/prepare-pages.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish only the deployable application
          path: work/pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
